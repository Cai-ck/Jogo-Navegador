<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

<body>
  <div class="game-container">
  
   <div class ="hud-container">
     <div class = "hud-item">Score: <span id="score">0</span></div>
     <div class = "hud-item">Timer: <span id="timer">0</span></div>
     <div class = "hud-item">Best Score: <span id="record">0</span></div>
   </div> 

    <div id="game-over-screen" style="display: none;">
        <h2>Game Over</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <h3 id ="new-record" style="color: gold; display: none;">NEW RECORD!</h3>
        <button id="restart-button" onclick="reiniciarJogo()">Restart</button>
    </div>

      <canvas id="window-game" width="800" height="400"></canvas>
   </div>
